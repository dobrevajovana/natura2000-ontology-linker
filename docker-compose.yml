services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    volumes:
      - natura2000_data:/data
    env_file:
      - path: .env          # optional: copy .env.example to .env to change settings
        required: false
    environment:
      - DATA_DIR=/data
    profiles:
      - pipeline

  viz:
    build:
      context: .
      dockerfile: Dockerfile.viz
    volumes:
      - natura2000_data:/data
      # The MFD viewer at /mfd/: its data and the experts' reviews (mfd/reviews.jsonl).
      # Same layout as docker-compose.mfd.yml, so either can run on the same volume.
      - mfd_data:/mfd_data
      # Experts' reviews as plain files on this computer (reviews.jsonl, the full
      # history, and mfd-match-reviews.csv, the current state). Not in OneDrive:
      # Docker Desktop cannot write there. Change the folder with MFD_REVIEWS_DIR.
      - ${MFD_REVIEWS_DIR:-${HOME}/natura2000-reviews}:/reviews
      # Mapping files to validate at /validate/: drop any linker output, SSSOM or table here
      # (or upload it on the page). Decisions go to the reviews folder, under validate/.
      - ${VALIDATE_DIR:-${HOME}/natura2000-validate}:/incoming
    env_file:
      - path: .env          # optional: copy .env.example to .env to change settings
        required: false
    ports:
      - "${VIZ_PORT:-8080}:8080"
    environment:
      - DATA_DIR=/data
      - MFD_DATA_DIR=/mfd_data
      - MFD_REVIEWS_FILE=/reviews/reviews.jsonl
      # The cloud samples viewer at /cloud/: data in the same volume (cloud/),
      # reviews beside the MFD ones as cloud-reviews.jsonl and cloud-match-reviews.csv.
      - CLOUD_DATA_DIR=/mfd_data
      - CLOUD_REVIEWS_FILE=/reviews/cloud-reviews.jsonl
      - VALIDATE_DIR=/incoming
      - VALIDATE_REVIEWS_DIR=/reviews/validate
    profiles:
      - viz

volumes:
  natura2000_data:
  mfd_data:
