services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    volumes:
      - natura2000_data:/data
    env_file:
      - path: .env          # optional: copy .env.example to .env to change settings
        required: false
    environment:
      - DATA_DIR=/data
    profiles:
      - pipeline

  viz:
    build:
      context: .
      dockerfile: Dockerfile.viz
    volumes:
      - natura2000_data:/data
    env_file:
      - path: .env          # optional: copy .env.example to .env to change settings
        required: false
    ports:
      - "${VIZ_PORT:-8080}:8080"
    environment:
      - DATA_DIR=/data
    profiles:
      - viz

volumes:
  natura2000_data:
