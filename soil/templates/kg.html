<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<style>
  /* Same look as the MFD and Natura 2000 viewers. */
  :root {
    --bg: #f5f6f8; --panel-bg: #ffffff; --border: #d9dce1; --text: #1b1e23; --text-muted: #5b6270;
    --accent: #1565c0; --accent-contrast: #ffffff; --input-bg: #ffffff; --chip-bg: #eef1f5;
    --k-mfd: #5e8c31; --k-nmdc: #8e44ad; --k-envo: #27ae60; --k-gold: #e67e22; --k-n2k: #2a78d6; --k-other: #7f8c8d;
    --shared: #d81b60;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --panel-bg: #1c1f24; --border: #33383f; --text: #e7e9ec; --text-muted: #9aa1ab;
      --accent: #5c9cea; --accent-contrast: #0d1117; --input-bg: #22262c; --chip-bg: #262a31;
      --k-mfd: #7fb24a; --k-nmdc: #b07cc6; --k-envo: #4cc27e; --k-gold: #f0954a; --k-n2k: #3987e5; --k-other: #9aa5a6;
      --shared: #f06292;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px;
    background: var(--panel-bg); border-bottom: 1px solid var(--border); }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar a { color: var(--accent); font-size: 12px; }
  .layout { display: flex; height: calc(100vh - 42px); min-height: 480px; }
  .side { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--panel-bg); border-right: 1px solid var(--border); }
  .side-scroll { overflow-y: auto; padding: 12px; flex: 1; min-height: 0; }
  .group { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .group:last-child { border-bottom: none; }
  .group h3 { font-size: 12.5px; margin: 0 0 6px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .muted { color: var(--text-muted); font-size: 12px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tab { flex: 1; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; cursor: pointer; }
  .tab.on { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  input[type="search"] { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--input-bg); margin-bottom: 6px; }
  .tree { margin: 0 -12px; max-height: 46vh; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 4px; padding: 3px 12px 3px 0; cursor: pointer; font-size: 13px; }
  .row:hover { background: var(--chip-bg); }
  .row.sel { background: var(--accent); color: var(--accent-contrast); }
  .row .tw { width: 18px; flex: none; text-align: center; color: inherit; opacity: 0.6; font-size: 9px; }
  .row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--chip-bg); color: var(--text-muted); white-space: nowrap; }
  .row.sel .chip { background: transparent; color: inherit; border: 1px solid currentColor; }
  .chip.meet { background: var(--shared); color: #fff; }
  dl { display: grid; gap: 4px; margin: 0; }
  dl > div { display: flex; justify-content: space-between; font-size: 13px; }
  dt { color: var(--text-muted); } dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .legend span.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .main { flex: 1; position: relative; min-width: 0; }
  #cy { position: absolute; inset: 0; }
  .note { position: absolute; left: 12px; top: 10px; right: 12px; font-size: 12.5px; color: var(--text-muted); pointer-events: none; }
  .detail { position: absolute; right: 12px; top: 12px; width: 340px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .detail h2 { font-size: 15px; margin: 0 22px 6px 0; }
  .detail .x { position: absolute; right: 8px; top: 6px; border: none; background: none; cursor: pointer; font-size: 18px; color: var(--text-muted); }
  .detail label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin: 10px 0 4px; }
  .detail ul { margin: 0; padding-left: 16px; } .detail li { margin: 2px 0; font-size: 13px; }
  .detail a { color: var(--accent); }
  .badge { display: inline-block; font-size: 11px; color: #fff; padding: 1px 7px; border-radius: 8px; margin-right: 4px; }
  @media (max-width: 760px) {
    .layout { flex-direction: column; height: auto; }
    .side { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .main { height: 70vh; }
    .detail { width: auto; left: 12px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>Soil knowledge graph <span class="muted">MFD + NMDC</span></h1>
  <span><a href="../mfd/" id="mfdLink">MFD viewer</a> · <a href="../" id="backLink">Natura 2000 viewer</a></span>
</div>
<div class="layout">
  <aside class="side"><div class="side-scroll">
    <div class="group">
      <h3>Hierarchy</h3>
      <div class="tabs"><button class="tab on" data-tree="mfd">MFD ontology</button><button class="tab" data-tree="nmdc">NMDC contexts</button></div>
      <input type="search" id="search" placeholder="Filter by name">
      <div class="muted" id="treeHint"></div>
      <div class="tree" id="tree"></div>
    </div>
    <div class="group"><h3>Where they meet</h3><dl id="stats"></dl></div>
    <div class="group"><h3>Legend</h3><div class="legend" id="legend"></div></div>
  </div></aside>
  <main class="main">
    <div id="cy"></div>
    <div class="note" id="note"></div>
    <div class="detail" id="detail" hidden><button class="x" id="close" aria-label="Close">×</button><div id="detailBody"></div></div>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : '#';
const KINDS = {
  mfd: ['MFD class', '--k-mfd', 'round-rectangle'], context: ['NMDC context', '--k-nmdc', 'round-rectangle'],
  envo: ['ENVO', '--k-envo', 'ellipse'], gold: ['GOLD', '--k-gold', 'hexagon'], natura2000: ['Natura 2000', '--k-n2k', 'ellipse'],
};
const kindOf = (k) => KINDS[k] || [k ? k.replace(/^ols4_/, '').toUpperCase() : 'Other', '--k-other', 'ellipse'];
const EDGE_LABEL = { linker: 'match', envo: 'ENVO (record)', gold: 'GOLD path', gold_env_local: 'GOLD env_local', is_a: 'is a', within: 'within', mfd_crosswalk: 'MFD crosswalk' };
const MAX_NODES = 400;

let kg = { meta: {}, nodes: [], edges: [], trees: { mfd: [], nmdc: [] } };
let byId = {}, out = {}, into = {}, cy = null, tree = 'mfd', selected = null;
const open = new Set();

fetch('data/kg.json').then((r) => r.json()).then((d) => {
  kg = d;
  kg.nodes.forEach((n) => byId[n.id] = n);
  kg.edges.forEach((e) => { (out[e.source] ??= []).push(e); (into[e.target] ??= []).push(e); });
  drawStats(); drawLegend(); drawTree(); drawGraph();
});

const shared = (n) => (n?.datasets || []).length === 2;
const kids = () => { const k = {}; kg.trees[tree].forEach((t) => (k[t.parent ?? ''] ??= []).push(t)); return k; };

function drawStats() {
  const m = kg.meta, by = m.shared_by_kind || {};
  const rows = [
    ['MFD classes in the graph', m.mfd_classes], ['NMDC contexts', m.nmdc_contexts],
    ['Shared ENVO terms', by.envo], ['Shared GOLD classes', by.gold],
    ['MFD classes that meet NMDC', m.mfd_classes_meeting_nmdc],
  ];
  $('stats').innerHTML = rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${(v ?? 0).toLocaleString()}</dd></div>`).join('') +
    (m.inputs ? `<div class="muted" style="margin-top:6px">${['mfd', 'nmdc', 'gold'].filter((k) => !m.inputs[k]).map((k) => `No ${k.toUpperCase()} input yet.`).join(' ')}</div>` : '<div class="muted">No soil KG yet. Run python -m soil.kg</div>');
}

function drawLegend() {
  const dot = (v, extra = '') => `<span class="dot" style="background:${css(v)};${extra}"></span>`;
  $('legend').innerHTML = Object.values(KINDS).map(([l, v]) => `<div>${dot(v)}${l}</div>`).join('') +
    `<div>${dot('--bg', `border:3px solid ${css('--shared')}`)}Reached by both MFD and NMDC</div>`;
}

// ─── Tree ────────────────────────────────────────────────────────────────────
function drawTree() {
  const k = kids(), q = $('search').value.trim().toLowerCase();
  const items = kg.trees[tree];
  $('treeHint').textContent = items.length ? (tree === 'mfd' ? 'Pink: the class leads to a term NMDC also uses.' : 'broad › local › medium, with sample counts.')
    : `No ${tree.toUpperCase()} data yet.`;
  let keep = null;
  if (q) {
    keep = new Set();
    const byT = Object.fromEntries(items.map((t) => [t.id, t]));
    items.filter((t) => t.label.toLowerCase().includes(q)).forEach((t) => { for (let p = t; p; p = byT[p.parent]) keep.add(p.id); });
  }
  const rows = [];
  const walk = (parent, depth) => (k[parent] || []).forEach((t) => {
    if (keep && !keep.has(t.id)) return;
    const has = (k[t.id] || []).length, isOpen = keep || open.has(t.id);
    const g = byId[t.id], chip = tree === 'mfd'
      ? (t.code ? `<span class="chip">N2K ${esc(t.code)}</span>` : '') + (g?.meets_nmdc ? '<span class="chip meet">NMDC</span>' : '')
      : `<span class="chip">${t.samples ?? 0}</span>${shared(g) ? '<span class="chip meet">MFD</span>' : ''}`;
    rows.push(`<div class="row${selected === t.id ? ' sel' : ''}" data-id="${esc(t.id)}" style="padding-left:${depth * 14}px">
      <span class="tw" data-tw="${esc(t.id)}">${has ? (isOpen ? '▼' : '▶') : ''}</span><span class="lbl" title="${esc(t.label)}">${esc(t.label)}</span>${chip}</div>`);
    if (has && isOpen) walk(t.id, depth + 1);
  });
  walk('', 0);
  $('tree').innerHTML = rows.join('');
}
$('tree').addEventListener('click', (e) => {
  const tw = e.target.closest('[data-tw]'), row = e.target.closest('.row');
  if (tw && tw.textContent) { open.has(tw.dataset.tw) ? open.delete(tw.dataset.tw) : open.add(tw.dataset.tw); drawTree(); return; }
  if (!row) return;
  selected = selected === row.dataset.id ? null : row.dataset.id;
  drawTree(); drawGraph();
  if (selected && byId[selected]) showDetail(byId[selected]);
});
document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
  tree = b.dataset.tree; selected = null; drawTree(); drawGraph();
}));
$('search').addEventListener('input', drawTree);

// ─── Graph ───────────────────────────────────────────────────────────────────
function below(ids) {
  const seen = new Set(ids), todo = [...ids];
  while (todo.length) for (const e of out[todo.pop()] || []) if (!seen.has(e.target) && byId[e.target]) { seen.add(e.target); todo.push(e.target); }
  return seen;
}
// The other dataset's own nodes that point straight at ``ids``.
function meeting(ids) {
  const found = new Set();
  ids.forEach((id) => (into[id] || []).forEach((e) => {
    const k = byId[e.source]?.kind;
    if ((k === 'mfd' || k === 'context') && !ids.has(e.source)) found.add(e.source);
  }));
  return found;
}

function scope() {
  if (selected) {
    const k = kids(), roots = [];
    const walk = (id) => { roots.push(id); (k[id] || []).forEach((t) => walk(t.id)); };
    walk(selected);
    const ids = below(roots.filter((id) => byId[id]));
    const meet = meeting(new Set([...ids].filter((id) => shared(byId[id]))));
    return { ids: new Set([...ids, ...meet]), note: `${byId[selected]?.label || selected} and everything it leads to, plus the ${tree === 'mfd' ? 'NMDC contexts' : 'MFD classes'} that meet it.` };
  }
  const sh = new Set(kg.nodes.filter(shared).map((n) => n.id));
  return { ids: new Set([...sh, ...meeting(sh)]), note: sh.size ? 'Where MFD and NMDC meet: the shared terms and the classes and contexts that point at them. Pick a branch on the left to explore it.' : 'MFD and NMDC share no terms yet.' };
}

function drawGraph() {
  let { ids, note } = scope();
  if (ids.size > MAX_NODES) { ids = new Set([...ids].slice(0, MAX_NODES)); note += ` Showing the first ${MAX_NODES} nodes; pick a smaller branch.`; }
  $('note').textContent = note;
  const edges = kg.edges.filter((e) => ids.has(e.source) && ids.has(e.target));
  const els = [
    ...[...ids].map((id) => { const n = byId[id], [, v, shape] = kindOf(n.kind);
      return { data: { id, label: n.label, color: css(v), shape, border: shared(n) ? css('--shared') : css(v), bw: shared(n) ? 4 : 1 } }; }),
    ...edges.map((e, i) => ({ data: { id: 'e' + i, source: e.source, target: e.target, style: e.kind === 'is_a' || e.kind === 'within' ? 'dotted' : (e.match || '').includes('exact') || e.kind === 'envo' ? 'solid' : 'dashed' } })),
  ];
  if (cy) cy.destroy();
  cy = cytoscape({
    container: $('cy'), elements: els, wheelSensitivity: 0.3,
    layout: { name: 'cose', animate: false, nodeRepulsion: 9000, idealEdgeLength: 70 },
    style: [
      { selector: 'node', style: { 'background-color': 'data(color)', shape: 'data(shape)', label: 'data(label)', 'font-size': 10,
        color: css('--text'), 'text-valign': 'bottom', 'text-margin-y': 3, 'text-max-width': 120, 'text-wrap': 'ellipsis',
        width: 18, height: 18, 'border-color': 'data(border)', 'border-width': 'data(bw)' } },
      { selector: 'edge', style: { width: 1.4, 'line-color': css('--text-muted'), 'target-arrow-color': css('--text-muted'),
        'target-arrow-shape': 'triangle', 'arrow-scale': 0.7, 'curve-style': 'bezier', 'line-style': 'data(style)', opacity: 0.7 } },
      { selector: 'node:selected', style: { 'border-color': css('--accent'), 'border-width': 4 } },
    ],
  });
  cy.on('tap', 'node', (ev) => showDetail(byId[ev.target.id()]));
}

// ─── Detail ──────────────────────────────────────────────────────────────────
function showDetail(n) {
  const [label, v] = kindOf(n.kind);
  const link = (id) => `<a href="#" data-node="${esc(id)}">${esc(byId[id]?.label || id)}</a> <span class="muted">${esc(kindOf(byId[id]?.kind)[0])}</span>`;
  const list = (es, side) => es.length ? `<ul>${es.slice(0, 60).map((e) => `<li>${link(e[side])} <span class="muted">${esc(EDGE_LABEL[e.kind] || e.kind)}${e.match ? ' · ' + esc(e.match.replace('skos:', '')) : ''}${e.confidence != null ? ' · ' + (+e.confidence).toFixed(2) : ''}${e.samples ? ' · ' + e.samples + ' samples' : ''}${e.agrees === false ? ' · GOLD triad differs' : ''}</span></li>`).join('')}${es.length > 60 ? `<li class="muted">${es.length - 60} more</li>` : ''}</ul>` : '<p class="muted">None.</p>';
  $('detailBody').innerHTML = `
    <h2>${esc(n.label)}</h2>
    <div><span class="badge" style="background:${css(v)}">${esc(label)}</span>${(n.datasets || []).map((d) => `<span class="badge" style="background:${css(d === 'mfd' ? '--k-mfd' : '--k-nmdc')}">${d.toUpperCase()}</span>`).join('')}</div>
    ${n.path ? `<label>Path</label><div>${esc(String(n.path).split('>').map((s) => s.trim()).join(' › '))}</div>` : ''}
    ${n.curie ? `<label>ID</label><div>${esc(n.curie)}</div>` : ''}
    ${n.url ? `<label>Link</label><div><a href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${esc(n.url)}</a></div>` : ''}
    ${n.samples ? `<label>Samples</label><div>${n.samples}</div>` : ''}
    <label>Links to</label>${list(out[n.id] || [], 'target')}
    <label>Linked from</label>${list(into[n.id] || [], 'source')}`;
  $('detail').hidden = false;
}
$('detailBody').addEventListener('click', (e) => {
  const a = e.target.closest('[data-node]');
  if (!a) return;
  e.preventDefault();
  showDetail(byId[a.dataset.node]);
  cy?.$(':selected').unselect(); cy?.getElementById(a.dataset.node).select();
});
$('close').addEventListener('click', () => $('detail').hidden = true);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('detail').hidden = true; });
</script>
</body>
</html>
